version: '3.8'

services:
  cassandra:
    image: cassandra:4.1
    container_name: cassandra
    ports:
      - "9042:9042"
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 30s
      timeout: 10s
      retries: 10

  cassandra-init:
    image: cassandra:4.1
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./docker/cassandra-schema.cql:/schema.cql
    entrypoint: [ "sh", "-c", "until cqlsh cassandra -e 'describe keyspaces'; do sleep 5; done && cqlsh cassandra -f /schema.cql" ]

  urlshortener:
    build:
      context: .
      dockerfile: URL_Shortener/Dockerfile
    depends_on:
      - cassandra-init
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080

volumes:
  cassandra_data: