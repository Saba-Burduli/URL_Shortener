version: '3.9'

services:
  cassandra:
    image: cassandra:4.1
    container_name: cassandra
    ports:
      - "9042:9042"
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 30s
      timeout: 10s
      retries: 10

  cassandra-init:
    image: cassandra:4.1
    depends_on:
      - cassandra
    volumes:
      - ./docker/cassandra-schema.cql:/schema.cql
    entrypoint: [ "sh", "-c", "until cqlsh cassandra -e 'describe keyspaces'; do sleep 5; done && cqlsh cassandra -f /schema.cql" ]

  urlshortener:
    build:
      context: ./src/UrlShortener.Api
    depends_on:
      - cassandra
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      - default

volumes:
  cassandra_data:
    